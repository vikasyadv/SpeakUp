spring:
  datasource:
    url: jdbc:mysql://localhost:3306/speakup_dev?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${SPEAKUP_DB_USER:root}
    password: ${SPEAKUP_DB_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  sql:
    init:
      mode: always
      continue-on-error: true

logging:
  level:
    com.speakup: DEBUG
    org.hibernate.SQL: DEBUG
