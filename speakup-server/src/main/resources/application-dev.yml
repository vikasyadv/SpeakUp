spring:
  datasource:
    url: jdbc:mysql://localhost:3306/speakup_dev?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${SPEAKUP_DB_USER:root}
    password: ${SPEAKUP_DB_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
      continue-on-error: true

logging:
  level:
    com.speakup: DEBUG
    org.hibernate.SQL: DEBUG

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    url: https://generativelanguage.googleapis.com/v1beta/models
  model: gemini-3.6-flash

jwt:
  secret: ${JWT_SECRET:speakup-dev-jwt-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256}
  expiration-hours: ${JWT_EXPIRATION_HOURS:168}
